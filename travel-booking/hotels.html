<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse and filter hotels across India's top destinations – TravelEase." />
  <title>Hotels – TravelEase</title>

  <!-- Shared stylesheet (same file used across all pages) -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plh7eqjn8fE/qSAkYdn7+RZg7gSvUQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!--
    Page-specific styles for hotels.html.
    We use a <style> block here for styles that only apply to
    this page — keeping style.css clean and shared.
    In a bigger project these would go in css/hotels.css.
  -->
  <style>
    /* ── PAGE HERO BANNER ── */
    .page-hero {
      background: linear-gradient(
          135deg,
          rgba(8, 20, 55, 0.82) 0%,
          rgba(26, 115, 232, 0.60) 100%
        ),
        linear-gradient(160deg, #081437 0%, #1a4fa8 60%, #0e8a6e 100%);
      padding: var(--sp-16) var(--sp-6) var(--sp-12);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .page-hero__content { position: relative; z-index: 1; }

    .page-hero__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-5);
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
      margin-bottom: var(--sp-5);
    }

    .page-hero__title {
      font-family: var(--ff-heading);
      font-size: var(--fs-4xl);
      font-weight: 700;
      color: var(--clr-white);
      margin-bottom: var(--sp-4);
      text-shadow: 0 2px 16px rgba(0,0,0,0.3);
    }

    .page-hero__subtitle {
      font-size: var(--fs-md);
      color: rgba(255,255,255,0.80);
      max-width: 500px;
      margin-inline: auto;
    }

    /* ── SEARCH BAR (below hero) ── */
    .hotels-search-wrap {
      background-color: var(--clr-white);
      border-bottom: 1px solid var(--clr-border);
      padding: var(--sp-5) var(--sp-6);
      position: sticky;
      top: var(--navbar-height);
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .hotels-search {
      max-width: var(--max-width);
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      background-color: var(--clr-bg);
      border: 2px solid var(--clr-border);
      border-radius: var(--radius-full);
      padding: var(--sp-3) var(--sp-5);
      transition: border-color var(--ease-base), box-shadow var(--ease-base);
    }

    .hotels-search:focus-within {
      border-color: var(--clr-primary);
      box-shadow: 0 0 0 4px var(--clr-primary-light);
    }

    .hotels-search i {
      color: var(--clr-text-muted);
      font-size: var(--fs-md);
      flex-shrink: 0;
    }

    .hotels-search__input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: var(--fs-base);
      color: var(--clr-text-heading);
    }

    .hotels-search__input::placeholder { color: var(--clr-text-faint); }

    .hotels-search__clear {
      background: none;
      border: none;
      color: var(--clr-text-muted);
      cursor: pointer;
      padding: var(--sp-1);
      border-radius: 50%;
      display: none;   /* shown by JS when input has text */
      transition: color var(--ease-fast), background-color var(--ease-fast);
    }

    .hotels-search__clear:hover { color: var(--clr-danger); }
    .hotels-search__clear.is-visible { display: block; }

    /* ── LAYOUT: sidebar + main ── */
    .hotels-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--sp-8);
      max-width: var(--max-width);
      margin-inline: auto;
      padding: var(--sp-8) var(--sp-6);
      align-items: start;
    }

    /* ── FILTER SIDEBAR ── */
    .filters {
      position: sticky;
      top: calc(var(--navbar-height) + 82px); /* below navbar + search */
      background-color: var(--clr-white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .filters__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--clr-border);
      background-color: var(--clr-bg);
    }

    .filters__title {
      font-size: var(--fs-base);
      font-weight: 700;
      color: var(--clr-text-heading);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .filters__title i { color: var(--clr-primary); }

    .filters__reset {
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--clr-primary);
      background: none;
      border: none;
      cursor: pointer;
      transition: color var(--ease-fast);
    }

    .filters__reset:hover { color: var(--clr-primary-dark); }

    /* Each filter group */
    .filter-group {
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--clr-border);
    }

    .filter-group:last-child { border-bottom: none; }

    .filter-group__label {
      font-size: var(--fs-sm);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--clr-text-muted);
      margin-bottom: var(--sp-4);
    }

    /* Destination buttons */
    .filter-group__options {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .filter-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--clr-border);
      background-color: var(--clr-white);
      color: var(--clr-text-body);
      font-size: var(--fs-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--ease-fast);
      text-align: left;
    }

    .filter-btn:hover {
      border-color: var(--clr-primary);
      color: var(--clr-primary);
      background-color: var(--clr-primary-light);
    }

    .filter-btn.is-active {
      border-color: var(--clr-primary);
      background-color: var(--clr-primary);
      color: var(--clr-white);
    }

    .filter-btn__count {
      font-size: var(--fs-xs);
      opacity: 0.75;
    }

    /* Price range slider */
    .price-range {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .price-range__values {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--clr-text-heading);
    }

    .price-range__slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: var(--radius-full);
      background: linear-gradient(
        to right,
        var(--clr-primary) 0%,
        var(--clr-primary) var(--fill, 50%),
        var(--clr-border) var(--fill, 50%)
      );
      outline: none;
      cursor: pointer;
    }

    .price-range__slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--clr-primary);
      border: 3px solid var(--clr-white);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform var(--ease-fast);
    }

    .price-range__slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Rating filter stars */
    .rating-options {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .rating-option {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--clr-border);
      background: var(--clr-white);
      cursor: pointer;
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--clr-text-body);
      transition: all var(--ease-fast);
    }

    .rating-option:hover {
      border-color: var(--clr-primary);
      background-color: var(--clr-primary-light);
    }

    .rating-option.is-active {
      border-color: var(--clr-primary);
      background-color: var(--clr-primary);
      color: var(--clr-white);
    }

    .rating-option.is-active .stars { color: var(--clr-white); }

    /* ── MAIN CONTENT: toolbar + grid ── */
    .hotels-main {}

    .hotels-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-6);
      gap: var(--sp-4);
      flex-wrap: wrap;
    }

    .hotels-toolbar__count {
      font-size: var(--fs-sm);
      color: var(--clr-text-muted);
    }

    .hotels-toolbar__count strong {
      color: var(--clr-text-heading);
      font-weight: 700;
    }

    /* Sort dropdown */
    .sort-select {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .sort-select label {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--clr-text-muted);
      white-space: nowrap;
    }

    .sort-select select {
      padding: var(--sp-2) var(--sp-4);
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius-full);
      background-color: var(--clr-white);
      color: var(--clr-text-heading);
      font-size: var(--fs-sm);
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: border-color var(--ease-fast);
    }

    .sort-select select:focus {
      border-color: var(--clr-primary);
    }

    /* Active filters chips */
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-bottom: var(--sp-5);
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      padding: var(--sp-1) var(--sp-3);
      border-radius: var(--radius-full);
      background-color: var(--clr-primary-light);
      color: var(--clr-primary);
      font-size: var(--fs-xs);
      font-weight: 600;
      border: 1px solid rgba(26,115,232,0.25);
    }

    .filter-chip button {
      background: none;
      border: none;
      color: var(--clr-primary);
      cursor: pointer;
      font-size: 0.65rem;
      padding: 0;
      line-height: 1;
      opacity: 0.7;
      transition: opacity var(--ease-fast);
    }

    .filter-chip button:hover { opacity: 1; }

    /* Hotel card grid */
    .hotels-grid {
      display: grid;
      grid-template-columns: 1fr;  /* 1 column: full-width list style */
      gap: var(--sp-5);
    }

    /* Override base .hotel-card for list layout */
    .hotels-grid .hotel-card {
      flex-direction: row;   /* image left, content right */
      height: 220px;
      border-radius: var(--radius-xl);
    }

    .hotels-grid .hotel-card__image-wrap {
      width: 280px;
      height: 100%;
      flex-shrink: 0;
      border-radius: var(--radius-xl) 0 0 var(--radius-xl);
    }

    .hotels-grid .hotel-card__body {
      flex: 1;
      padding: var(--sp-5) var(--sp-6);
      justify-content: space-between;
    }

    .hotels-grid .hotel-card__footer {
      padding: 0;
      border-top: none;
      background: none;
      margin-top: 0;
    }

    .hotel-card__desc {
      font-size: var(--fs-sm);
      color: var(--clr-text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;   /* show max 2 lines */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hotel-card__rooms {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--clr-success);
    }

    .hotel-card__rooms--low { color: var(--clr-danger); }

    /* Action buttons inside list card */
    .hotel-card__actions {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    .hotel-card__btn--details {
      padding: var(--sp-2) var(--sp-4);
      border-radius: var(--radius-full);
      border: 1.5px solid var(--clr-primary);
      color: var(--clr-primary);
      background: transparent;
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease-base);
    }

    .hotel-card__btn--details:hover {
      background: var(--clr-primary);
      color: var(--clr-white);
    }

    /* Empty / no-results state */
    .hotels-empty {
      text-align: center;
      padding: var(--sp-20) var(--sp-6);
      color: var(--clr-text-muted);
    }

    .hotels-empty i {
      font-size: 3rem;
      color: var(--clr-border);
      margin-bottom: var(--sp-5);
    }

    .hotels-empty h3 {
      font-size: var(--fs-xl);
      color: var(--clr-text-heading);
      margin-bottom: var(--sp-3);
    }

    /* Mobile filter toggle button */
    .filter-toggle-btn {
      display: none;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-5);
      background-color: var(--clr-primary);
      color: var(--clr-white);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: var(--sp-5);
    }

    /* Mobile filter overlay drawer */
    .filters-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 500;
      opacity: 0;
      transition: opacity var(--ease-base);
    }

    .filters-overlay.is-open {
      opacity: 1;
    }

    .filters-drawer {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 300px;
      background: var(--clr-white);
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform var(--ease-slow);
    }

    .filters-overlay.is-open .filters-drawer {
      transform: translateX(0);
    }

    .filters-drawer__close {
      position: absolute;
      top: var(--sp-4);
      right: var(--sp-4);
      background: none;
      border: none;
      font-size: var(--fs-xl);
      color: var(--clr-text-muted);
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .hotels-layout {
        grid-template-columns: 240px 1fr;
        gap: var(--sp-6);
      }

      .hotels-grid .hotel-card__image-wrap { width: 220px; }
    }

    @media (max-width: 768px) {
      .hotels-layout {
        grid-template-columns: 1fr;
      }

      .filters { display: none; }    /* sidebar hidden on mobile */
      .filter-toggle-btn { display: flex; }
      .filters-overlay { display: block; }

      .hotels-grid .hotel-card {
        flex-direction: column;
        height: auto;
      }

      .hotels-grid .hotel-card__image-wrap {
        width: 100%;
        height: 200px;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      }

      .page-hero__title { font-size: var(--fs-3xl); }
    }
  <script src="js/theme.js"></script>
</head>

<body>

  <!-- ── NAVBAR (same on every page) ── -->
  <header>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a href="index.html" class="navbar__logo" aria-label="TravelEase home">
        <i class="fa-solid fa-plane-departure" aria-hidden="true"></i>
        <span>TravelEase</span>
      </a>

      <ul class="navbar__links" id="navLinks" role="list">
        <li><a href="index.html"  class="navbar__link">Home</a></li>
        <li><a href="index.html#destinations" class="navbar__link">Destinations</a></li>
        <li><a href="hotels.html" class="navbar__link active" aria-current="page">Hotels</a></li>
        <li><a href="booking.html"            class="navbar__link">Bookings</a></li>
        <li><a href="bookings.html"           class="navbar__link">My Bookings</a></li>
        <li>
          <a href="wishlist.html" class="navbar__link">
            <i class="fa-regular fa-heart" aria-hidden="true"></i>
            Wishlist
            <span class="wishlist-badge" id="wishlistBadge" style="display:none;" aria-label="wishlist count">0</span>
          </a>
        </li>
        <li><a href="index.html#contact" class="navbar__link">Contact</a></li>
      </ul>

      <button
        class="navbar__hamburger"
        id="hamburgerBtn"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <span class="hamburger__bar"></span>
        <span class="hamburger__bar"></span>
        <span class="hamburger__bar"></span>
      </button>

      <!-- Dark / Light mode toggle -->
      <button
        class="theme-toggle"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      >
        <span class="theme-toggle__icon">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </span>
      </button>

    </nav>
  </header>


  <main>

    <!-- ── PAGE HERO ── -->
    <section class="page-hero" aria-label="Hotels page header">
      <div class="page-hero__content">
        <p class="page-hero__eyebrow">
          <i class="fa-solid fa-hotel" aria-hidden="true"></i>
          Handpicked Stays
        </p>
        <h1 class="page-hero__title">Find Your Perfect Stay</h1>
        <p class="page-hero__subtitle">
          Browse hotels across India's most-loved destinations — filtered, sorted, and ready to book.
        </p>
      </div>
    </section>

    <!-- ── STICKY SEARCH BAR ── -->
    <div class="hotels-search-wrap" role="search" aria-label="Search hotels">
      <div class="hotels-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input
          type="text"
          class="hotels-search__input"
          id="hotelSearchInput"
          placeholder="Search by hotel name, city or location…"
          autocomplete="off"
          aria-label="Search hotels"
        />
        <button
          class="hotels-search__clear"
          id="searchClearBtn"
          aria-label="Clear search"
          title="Clear"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>


    <!-- ── MAIN LAYOUT: SIDEBAR + CONTENT ── -->
    <div class="hotels-layout">

      <!-- ── FILTER SIDEBAR (desktop) ── -->
      <aside class="filters" id="filterSidebar" aria-label="Hotel filters">

        <div class="filters__header">
          <span class="filters__title">
            <i class="fa-solid fa-sliders" aria-hidden="true"></i>
            Filters
          </span>
          <button class="filters__reset" id="resetFiltersBtn" aria-label="Reset all filters">
            Reset All
          </button>
        </div>

        <!-- DESTINATION FILTER -->
        <div class="filter-group">
          <p class="filter-group__label">Destination</p>
          <div class="filter-group__options" id="destinationFilters" role="group" aria-label="Filter by destination">
            <!-- Buttons injected by hotels.js -->
          </div>
        </div>

        <!-- PRICE FILTER -->
        <div class="filter-group">
          <p class="filter-group__label">Max Price Per Night</p>
          <div class="price-range">
            <div class="price-range__values">
              <span>₹0</span>
              <span id="priceDisplay" aria-live="polite">₹30,000</span>
            </div>
            <!--
              range input: min=0, max=30000, value=30000 (default = show all).
              JS reads this value to filter hotels in real time.
            -->
            <input
              type="range"
              class="price-range__slider"
              id="priceFilter"
              min="0"
              max="30000"
              value="30000"
              step="500"
              aria-label="Maximum price per night"
              aria-valuemin="0"
              aria-valuemax="30000"
              aria-valuenow="30000"
            />
          </div>
        </div>

        <!-- CATEGORY FILTER -->
        <div class="filter-group">
          <p class="filter-group__label">Category</p>
          <div class="filter-group__options" role="group" aria-label="Filter by category">
            <button class="filter-btn is-active" data-category="all" aria-pressed="true">
              All Categories
            </button>
            <button class="filter-btn" data-category="Luxury" aria-pressed="false">
              <span>✦ Luxury</span>
              <span class="filter-btn__count"></span>
            </button>
            <button class="filter-btn" data-category="Premium" aria-pressed="false">
              <span>◈ Premium</span>
              <span class="filter-btn__count"></span>
            </button>
            <button class="filter-btn" data-category="Budget" aria-pressed="false">
              <span>◇ Budget</span>
              <span class="filter-btn__count"></span>
            </button>
          </div>
        </div>

        <!-- RATING FILTER -->
        <div class="filter-group">
          <p class="filter-group__label">Minimum Rating</p>
          <div class="rating-options" id="ratingFilters" role="group" aria-label="Filter by minimum rating">
            <button class="rating-option is-active" data-min-rating="0" aria-pressed="true">
              <span>All Ratings</span>
            </button>

        <div class="hotels-grid" id="hotelsGrid" role="list" aria-label="Hotel listings">
